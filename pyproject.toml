[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opsharness-ecommerce"
version = "0.1.0"
description = "An open e-commerce operations agent that runs on the opsharness agent harness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["opsharness @ git+https://github.com/prithsk/opsharness@v0.2.0"]

[project.entry-points."opsharness.worlds"]
ecommerce = "opsharness_ecommerce.world:EcommerceEnv"

[tool.setuptools]
packages = ["opsharness_ecommerce"]

[tool.setuptools.package-data]
opsharness_ecommerce = ["*.md"]
